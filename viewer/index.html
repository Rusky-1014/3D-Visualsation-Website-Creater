<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThreeStage — Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@400;700&family=Space+Grotesk:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&family=Sora:wght@300;400;600;700&family=DM+Sans:wght@400;500;700&family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600;700&family=Lato:wght@300;400;700&family=Open+Sans:wght@300;400;600;700&family=Oswald:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700&family=Nunito:wght@300;400;600;700&family=Bebas+Neue&family=Archivo+Black&family=Lobster&family=Righteous&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader-ring"></div>
    <p id="loading-text">Loading Experience…</p>
  </div>

  <!-- Scroll Progress Bar -->
  <div id="progress-bar"></div>

  <!-- Slide Indicator Dots -->
  <div id="slide-dots"></div>

  <!-- Fixed 3D Canvas -->
  <canvas id="viewer-canvas"></canvas>

  <!-- Scroll Scaffolding (overlay containers get appended to body) -->
  <div id="scroll-container"></div>

  <!-- Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
