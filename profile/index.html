<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThreeStage - User Profile</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="profile.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Custom Cursor & Light Beam -->
  <div id="cursor-ring"></div>
  <canvas id="beam-canvas"></canvas>

  <!-- 3D Holo-Gallery Background -->
  <canvas id="profile-canvas"></canvas>

  <nav id="main-nav">
    <a href="/landing/" class="logo">Three<span style="color: #00ccff;">Stage</span></a>
    <div class="nav-links">
      <button id="new-project-btn" class="nav-btn primary">New Project</button>
      <a href="/auth/" class="nav-btn secondary">Sign Out</a>
    </div>
  </nav>

  <main class="profile-layout">
    
    <!-- Left Sidebar: User Details -->
    <aside class="profile-sidebar">
      <div class="user-avatar">
        <div class="avatar-ring"></div>
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=ThreeStageBuilder" alt="User Avatar">
      </div>
      <h1 class="user-name">Welcome, Architect</h1>
      <p class="user-email">architect@threestage.io</p>
      
      <div class="user-stats">
        <div class="stat-box">
          <span class="stat-num">12</span>
          <span class="stat-label">Projects</span>
        </div>
        <div class="stat-box">
          <span class="stat-num">8.4k</span>
          <span class="stat-label">Views</span>
        </div>
        <div class="stat-box">
          <span class="stat-num">Pro</span>
          <span class="stat-label">Plan</span>
        </div>
      </div>

      <div class="sidebar-menu">
        <a href="#" class="menu-item active">My Gallery</a>
        <a href="#" class="menu-item">Settings</a>
        <a href="#" class="menu-item">Billing</a>
      </div>
    </aside>

    <!-- Main Content: Project Cards -->
    <section class="projects-area">
      <div class="area-header">
        <h2>Your Holographic Gallery</h2>
        <p>Interact with the 3D carousel to browse your deployed sites.</p>
      </div>

      <div class="projects-grid" id="projects-grid">
        <!-- Dynamic Projects will be injected here -->
      </div>
    </section>

  </main>

  <script type="module" src="profile.js"></script>
</body>
</html>
