<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThreeStage - Authentication</title>
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="auth.css">
  
  <!-- GSAP & Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Custom Cursor & Mouse Trail -->
  <div id="cursor-glow"></div>
  <canvas id="trail-canvas"></canvas>

  <!-- 3D Neural Background -->
  <canvas id="auth-canvas"></canvas>

  <!-- Navigation -->
  <nav id="main-nav">
    <a href="/landing/" class="logo">Three<span style="color: #00ccff;">Stage</span></a>
  </nav>

  <!-- Auth Container -->
  <main class="auth-wrapper">
    <div class="auth-box">
      
      <!-- Toggle Header -->
      <div class="auth-tabs">
        <button class="tab-btn active" data-target="login">Sign In</button>
        <button class="tab-btn" data-target="register">Create Account</button>
        <div class="tab-indicator"></div>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form active">
        <h2>Welcome Back</h2>
        <p class="subtitle">Enter your details to access your 3D workspace.</p>
        
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" placeholder="hello@example.com" required>
        </div>
        
        <div class="input-group">
          <label>Password</label>
          <input type="password" placeholder="••••••••" required>
        </div>
        
        <div class="form-actions">
          <label class="checkbox-container">
            <input type="checkbox">
            <span class="checkmark"></span>
            Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>
        
        <button type="submit" class="submit-btn">
          <span>Sign In</span>
          <div class="btn-glow"></div>
        </button>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="auth-form">
        <h2>Join ThreeStage</h2>
        <p class="subtitle">Start building cinematic 3D websites today.</p>
        
        <div class="input-group">
          <label>Full Name</label>
          <input type="text" placeholder="John Doe" required>
        </div>

        <div class="input-group">
          <label>Email Address</label>
          <input type="email" placeholder="hello@example.com" required>
        </div>
        
        <div class="input-group">
          <label>Password</label>
          <input type="password" placeholder="Create a strong password" required>
        </div>
        
        <button type="submit" class="submit-btn" style="margin-top: 16px;">
          <span>Create Account</span>
          <div class="btn-glow"></div>
        </button>
      </form>

    </div>
  </main>

  <!-- Scripts -->
  <script type="module" src="auth.js"></script>
</body>
</html>
